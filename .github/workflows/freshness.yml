name: freshness

# SR-0180.

# Dependencies here are declared as floors, not locked, so CI resolves whatever
# PyPI happens to publish. A green check is therefore only true on the day it ran:
# a release of something we depend on can turn this repo red without a commit
# here, and nothing would say so until a contributor next opened a pull request —
# who then meets a failure that has nothing to do with their change.
#
# This runs on the clock instead, so the drift is found by the schedule rather
# than by a person. Two ends are worth testing and they fail for opposite reasons:
# the ceiling catches a dependency that has moved ahead of us, the floor catches a
# minimum we have declared but no longer actually support.

on:
  schedule:
    # 03:17 UTC daily — outside UK working hours under both GMT and BST. Offset
    # from the hour because scheduled jobs queue heavily on the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling:
    name: latest published dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install, resolving dependencies fresh
        run: pip install -e ".[dev]"

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Grounding gate (demo graph must stay grounded)
        run: tl -C examples/grounding-demo check --strict --quiet

      - name: Self-host gate (throughline's own requirements must stay grounded)
        run: tl -C idd check --strict --quiet

      - name: Docs freshness gate (published docs must match the graph)
        run: tl -C idd docs --check

  floor:
    name: declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11" # the lowest interpreter we claim to support

      - name: Install at the declared floor
        # Read the floors out of pyproject rather than restating them here, so
        # this cannot drift from the versions the package actually promises.
        run: |
          pins=$(python -c "
          import tomllib
          deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']
          print(' '.join(d.replace('>=','==') for d in deps))
          ")
          echo "installing floor: $pins"
          pip install $pins
          pip install -e . --no-deps
          pip install pytest

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate (throughline's own requirements must stay grounded)
        run: tl -C idd check --strict --quiet
