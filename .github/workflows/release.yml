name: release

# Publishes throughline to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored as a secret. Before
# the first release, register this repository + workflow as a trusted publisher for
# the `throughline` project on PyPI (https://pypi.org/manage/account/publishing/)
# and create a GitHub Environment named `pypi`. Until then this workflow is dormant
# (it only runs on a published Release, and there is nothing to publish before then).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The tag names the version pyproject.toml declares
        # A release is the package version: a tag with another number would publish a
        # package nobody can find under the name the release bears, as v3.18.1 did on
        # 2026-10-15, publishing 3.18.0. The build stops here instead.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag v$tag does not match the version pyproject.toml declares, $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: pypi
      url: https://pypi.org/p/throughline
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        # Pinned to an immutable commit SHA, not @release/v1 (SR-0176): this step
        # receives an OIDC token exchangeable for upload rights to the PyPI project.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
