name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The check is named for the platform, not the runner: the ruleset on main
    # requires "test (ubuntu-latest, py3.12)" and its siblings by name, so a
    # name that followed the runner label stopped every merge when the jobs
    # moved to Blacksmith. Change a runner here freely; change a name only
    # together with the ruleset's required checks.
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            runner: blacksmith-4vcpu-ubuntu-2404
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: blacksmith-6vcpu-macos-latest
          # Prove the supported floor (README/CONTRIBUTING say Python >= 3.11).
          - os: ubuntu-latest
            runner: blacksmith-4vcpu-ubuntu-2404
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Grounding gate (demo graph must stay grounded)
        run: tl -C examples/grounding-demo check --strict --quiet

      - name: Self-host gate (throughline's own requirements must stay grounded)
        run: tl -C idd check --strict --quiet

      - name: Docs freshness gate (published docs must match the graph)
        run: tl -C idd docs --check

  docker:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t throughline:ci .

      - name: Smoke-test the image against the demo project
        run: |
          docker run --rm -v "$PWD/examples/grounding-demo:/work" \
            throughline:ci -C /work check --strict --quiet

      - name: Smoke-test the image against throughline's own requirements
        # Mount the whole repo (not just idd/) so the configured [docs] paths —
        # which live one level up under docs/ — resolve; the unpublished rule
        # globs them, so they must be present in the container.
        run: |
          docker run --rm -v "$PWD:/work" \
            throughline:ci -C /work/idd check --strict --quiet
