uid: BN-0005
type: business_need
status: ratified
title: Publishable
text: The graph's content is publishable to people who do not use the tool — rendered
  by reference into portable Markdown documents (which external tools convert to
  HTML or PDF), with a single documented JSON dump as the interchange surface for
  third-party tooling. The tool itself does not generate presentation or RM-vendor
  formats (NG-0005).
