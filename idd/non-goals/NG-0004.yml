uid: NG-0004
type: non_goal
status: ratified
title: No central identity server
text: throughline does not provide, and does not require, an online counter or coordinating
  service to allocate UIDs. Allocation atomicity derives solely from compare-and-swap
  on the trunk ref, keeping identity allocation viable for fully offline and zero-backend
  (e.g. in-browser) clients.
normative: true
