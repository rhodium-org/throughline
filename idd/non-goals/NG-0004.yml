uid: NG-0004
type: non_goal
status: ratified
title: No central identity server
text: throughline does not provide, and does not require, an online counter or coordinating
  service to allocate UIDs. A UID is allocated from the files a branch holds, and
  a clash between two branches is settled when they merge (SR-0006), keeping identity
  allocation viable for fully offline and zero-backend (e.g. in-browser) clients.
normative: false
