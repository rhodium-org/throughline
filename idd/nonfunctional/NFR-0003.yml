uid: NFR-0003
type: nfr
status: ratified
title: Offline and private
text: 'All specified functionality shall work with no network access, and the Tool
  shall send no telemetry or project data anywhere by default. The one exception
  is resolving a url source the project itself declares, on the terms SR-0233 states:
  at the pinned ref, cache first, never for a project that declares no sources, and
  never in cache-only mode.'
rationale: Amended 2026-09-18 when composition moved into the Tool. A url source
  the project declares is the one thing the Tool may fetch. SR-0233 states the cases
  and NG-0008 bounds them; the promise for every project that declares no sources
  is unchanged.
normative: true
