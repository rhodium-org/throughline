uid: SR-0079
type: system_requirement
status: ratified
title: CLI query command
text: The CLI shall provide a query command (alias ls) that lists the items matching
  an SR-0045 filter expression over type, status, register, attributes, normative
  flag, and text. It shall print each match as UID, type/status, and title, or emit
  the full items as JSON with --format json, and report the match count — so users
  can find requirements by attribute and status without external tools. A malformed
  expression shall produce an actionable error and a usage exit code.
normative: true
