uid: SR-0328
type: system_requirement
status: implemented
title: A number given as text is read in one stated form
text: Where an operation reads an int or float attribute value from text, an int
  shall be an optional sign and decimal digits, and a float the same with an optional
  fraction and an optional exponent; white space around the value is ignored and
  anything else is refused. Underscores between digits, inf and nan are refused.
rationale: 'The values are read by Python''s int() and float(), so 1_000, inf and
  nan are accepted because Python accepts them, and another implementation of the
  format cannot agree without copying Python. Every value tl has written is read
  the same. Who pays: an author who typed 1_000 or nan types 1000 or leaves the attribute
  unset.'
normative: true
