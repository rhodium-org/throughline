uid: SR-0252
type: system_requirement
status: ratified
title: tl apply carries out a change set of the Tool's own operations, all or nothing
text: 'tl apply FILE shall read a change set: a documented JSON list of new, amend,
  link, unlink and delete operations, each naming the item it touches. An operation
  on an existing item carries the revision it was based on. Apply shall refuse the
  whole set, naming every offending operation, when any revision differs from the
  item''s current one, when an operation is malformed, or when it is any other operation.
  Otherwise it shall carry out every operation through the same code as the matching
  command, recording each item it creates or changes with origin ai. A set in the
  earlier form, which quotes the fingerprint instead, shall still be read.'
rationale: 'Not the foreign-list import NG-0005 rules out: the change set holds only
  the Tool''s own operations, and each runs through the command that already does
  it, so no rule is written twice. Origin ai puts every result in proposed, so a
  person still decides; ratify, withdraw, clarify, status, schema and migrate are
  refused because those are decisions or structure, not drafting. All-or-nothing
  with revisions keeps an assistant''s change from landing on an item that moved
  in any way after the export; the fingerprint the first form quoted missed changes
  to title, rationale, links, status and non-normative attributes. The first form
  is still read so a set already drafted against it is not broken. Rejected: three-way
  merging of whole register files. Who pays: an author of a change set must quote
  revisions, which the dump carries (SR-0251).'
normative: true
links:
