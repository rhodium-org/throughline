uid: SR-0285
type: system_requirement
status: proposed
title: A standard declares its followers' shape as items of six kinds
text: A project whose schema source holds items of the types register, type, enum,
  attribute, link and link_type shall take from those items, and not from the source's
  configuration, the registers, attribute kinds and values, link types and link endpoint
  rules its followers are checked against. The six types, their attributes and their
  meaning are those of the meta-standard version the Tool implements; a standard
  cannot change them. A standard that makes the same kind of declaration both in
  its configuration and by items is refused when read, naming both.
rationale: 'One definition per declaration: items are ratified and fingerprinted,
  so amending a type makes every attribute using it suspect. Refusing both forms
  at once stops the two drifting apart. The meta-standard describes itself with the
  same six kinds.'
normative: true
