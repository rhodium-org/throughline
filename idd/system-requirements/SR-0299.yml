uid: SR-0299
type: system_requirement
status: implemented
title: A follower may alias a declaration it imports
text: A follower may declare an alias for a register, attribute or link type its
  standard declares, naming the standard's declaration and the name it is written
  under in the follower. tl check reads the alias as that declaration, and tl dump
  reports it under the standard's name. An alias that clashes with another name in
  the follower is refused when read.
rationale: Lets a follower keep its own name when a standard, or a new version of
  it, declares the same one, without renaming its items or coalescing two meanings
  under one name. The app still sees only the standard's names.
normative: true
