uid: SR-0349
type: system_requirement
status: ratified
title: A person declares the item type of a register that already exists
text: The Tool shall declare, on a person's command, the item type an existing register
  holds, replacing any type it declared before, and shall name each live item of
  the register whose type differs from it. It shall refuse a prefix no register owns
  and, where the project declares its item types, a type it neither declares nor
  finds on any of its live items. Wherever the Tool tells a person that a register
  declares no item type, it shall name this command with that register's prefix.
rationale: |-
  Found 15 November 2026 shaping rhodium-org/propertyqr with tl:shape under 5.10.0: the shape script made its registers with `tl register new` and no `--type`, so `tl new INT` was refused, and `tl migrate` (SR-0241) types only a register the Tool laid down or one whose items agree, so every empty register stayed untyped. The one remedy left was the one the refusal named, a hand edit of the `.register.yml`, which the agent brief forbids in the same breath. A type nothing declares and no item holds is most likely a misspelling, which a register would then hand to every item born in it; a type older graphs use without declaring it (intent, test) is still accepted, because items there already hold it.

  Who pays: nobody; a new command, and a refusal that now names it.
normative: true
