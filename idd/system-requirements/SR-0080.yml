uid: SR-0080
type: system_requirement
status: ratified
title: Deferred (parked) status
text: The Tool's default status set shall include a 'deferred' status for an item
  that is acknowledged and grounded but deliberately not scheduled — a parked backlog
  item, distinct from 'draft' (actively moving toward approval). Deferred items remain
  live (they are not tombstoned like 'deleted') so they still ground and appear in
  queries, letting authors separate the active work-front from the wish-list.
normative: true
