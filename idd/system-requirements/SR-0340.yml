uid: SR-0340
type: system_requirement
status: ratified
title: A GQL filter is never run as code
text: A GQL filter shall be read by a parser of the Tool's own for the constructs
  it accepts and evaluated by walking what that parser built. No part of a filter
  shall reach eval, exec, a database, a shell or any other interpreter, and a filter
  that cannot be parsed shall fail with an error naming where, never fall back to
  another reading.
rationale: 'SR-0103 says this of the earlier language and stays in force for it;
  this says it of the new one, so that changing the language does not quietly change
  the guarantee. Filters are read from documents, coverage rules and graphs composed
  from other people. Kept by Henry Grech-Cini''s decision of 14 November 2026. Who
  pays: nobody.'
normative: true
