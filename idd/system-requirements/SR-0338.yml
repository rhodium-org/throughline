uid: SR-0338
type: system_requirement
status: ratified
title: An item is read by a filter as the node the engines read
text: In a GQL filter the item shall have the properties uid, type, status, register,
  title, text, rationale, normative and derived; its standing, signed, stale, retired,
  reviewed and signers (SR-0335); one property for each attribute it holds, by the
  attribute's name, unless that name is one of the properties listed here; and attrs,
  a record of every attribute, through which one of those is read, as in item.attrs.status.
  A property the item does not hold is null. The other end of an edge pattern is
  the item a link points at or comes from, with the same properties, or, for a link
  target that is no item, a node whose one property is target. An edge is labelled
  by its link type.
rationale: 'This is the reading throughline-engine gives a graph as a property graph
  (its rules RULE-0447, RULE-0448 and RULE-0450), so a filter means the same in tl
  and in every engine. The standing names are tl''s (SR-0335) and are added to the
  engine''s list when its pin moves. Who pays: an attribute named like a field, such
  as status, is reached as item.attrs.status.'
normative: true
