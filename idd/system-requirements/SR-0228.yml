uid: SR-0228
type: system_requirement
status: implemented
title: The exported names are listed in the documentation, and a change to the list
  fails the build
text: The names the package exports shall be listed in the Tool's published documentation,
  and the Tool shall carry a test that fails when what the package exports differs
  from that list. A name leaves the list only by a release that says so.
rationale: |-
  NFR-0011 counts the library API as part of the compatibility surface, and SR-0061 asks for it to be documented. Neither has ever pointed at a list, so whether a change broke a caller has been a judgement made afresh each time — most recently over whether removing an unexported function needed a major release.

  A list nobody checks drifts, so the test is the requirement. Failing the build on a difference makes adding a name a decision rather than an accident, and taking one away impossible to do quietly.

  Rejected — treating every importable name as the interface. That makes each internal rename a breaking change, which is the position the family is trying to leave.

  Who pays: whoever adds an exported name updates one line of documentation. In exchange, an internal refactor stops being a release.
normative: true
