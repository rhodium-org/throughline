uid: SR-0022
type: system_requirement
status: ratified
title: Built-in core fields
text: 'The Tool shall reserve these top-level fields on every item: `uid`, `type`,
  `status`, `title`, `text`, `rationale`, `normative`, `derived`, `order`, `links`,
  `attrs`, `ratifications`, `withdrawals`, `implementations`, `reviewed`, `created`,
  `modified`, `deleted` and `key`.'
rationale: 'The list named twelve fields while the Tool reserves fifteen, so a reader
  who built against it got an item shape that rejects valid files (issue #39). rationale,
  attrs and deleted were missing, and order/level named a field the Tool calls order;
  doc 06 §4 already showed all fifteen. implementations joined the list with SR-0378,
  the dated record of when an item was built. The requirement says reserve rather
  than reserve and manage, because no command sets order, created or modified: the
  Tool reads them and writes them back unchanged.'
normative: true
links:
- target: UR-0011
  type: implements
- target: SR-0280
  type: relates
attrs:
  priority: must
  verification: test
