uid: SR-0286
type: system_requirement
status: proposed
title: A standard builds its types only from the base types
text: 'A type declaration shall name exactly one base type, by a has_type link: string,
  text, int, float, bool, date, enum or file. Its constraints are min and max (int,
  float and date), pattern (string) and list (any). A value set is declared by an
  enum item, which builds on the base type enum and lists its values. The Tool shall
  accept and refuse each value as the meta-standard''s test values for that base
  type and constraint say. A pattern may use only the subset the meta-standard defines,
  which reads the same in Python and JavaScript; any other construct is refused when
  read. A standard following a meta-standard version the Tool does not implement
  is refused, naming both versions.'
rationale: 'Every consumer of a standard (tl, presentation-manager, table.iddn.uk,
  the AI writing the graph) must implement every base type, so the set is small,
  closed and versioned. Range and limit are min and max, not types. Rejected: json,
  whose structure no check can see and which would be used to smuggle unchecked shape
  into a standard (operator, 1 Nov 2026); per-language regular expressions, where
  \d already differs between Python and JavaScript.'
normative: true
