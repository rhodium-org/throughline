uid: SR-0298
type: system_requirement
status: rejected
title: tl proposes declarations from the graphs that would follow
text: tl shall propose, as proposed AI-origin items in a standard, the register,
  attribute, value set and link declarations that one or more named graphs hold,
  and report each place the graphs disagree. It never changes a declaration once
  written.
rationale: 'Starts the real presentation standard from the six series and reports
  their drift. Never syncs: a rule that follows the data records drift as the rule.'
normative: true
links:
- target: UR-0044
  type: implements
attrs:
  priority: could
  verification: test
  origin: ai
  invalidated_reason: Proposing a standard from graphs that disagree is a matter
    of judgement (what to call a thing, which graph is right), which belongs in a
    skill an agent runs, not in a command of the Tool. The Tool checks followers
    against a standard (UR-0044); it does not write one. Decided by Henry Grech-Cini
    on 14 November 2026.
