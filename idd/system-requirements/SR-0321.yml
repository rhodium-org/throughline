uid: SR-0321
type: system_requirement
status: ratified
title: A list attribute is written one value at a time
text: For an attribute declared a list, by an attribute declaration with list true
  or by list = true in the configuration, tl new and tl amend shall write the values
  of every --attr naming it, in the order given, as one list, and tl apply shall
  accept a list of strings as its value and write it the same way. A value the configuration
  gives for list that is not true or false is refused when the configuration is read.
  tl docs renders its values joined by commas, never as the list's code form.
rationale: 'The meta-standard lets a standard declare an attribute a list (ATTR-0021),
  and tl check refuses a list attribute that is not a non-empty list, but no command
  could write one: tl amend --attr stored one string and tl apply refused any list
  (throughline-glossary-standard''s aliases, 10 November 2026). A list attribute
  could then be set only by editing the item''s file.'
normative: true
