uid: SR-0249
type: system_requirement
status: proposed
title: An item's file is named by its UID
text: The Tool shall report, as an error, an item whose file name is not its UID
  followed by .yml.
rationale: Git detects a parallel-branch UID collision only because both branches
  add the same path, which holds only while the file name and the UID agree. An item
  whose uid was edited without renaming its file escapes that detection and collides
  silently, and the merge resolution of SR-0248 cannot see it.
normative: true
links:
