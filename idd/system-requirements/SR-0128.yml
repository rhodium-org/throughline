uid: SR-0128
type: system_requirement
status: rejected
title: UID-GUID binding is frozen and baseline-verified
text: Once allocated, an item's UID-to-GUID binding shall be immutable. The validation
  gate shall flag, against the git baseline, any changed UID-GUID binding or any
  reissued retired UID, and shall require deletion to be a tombstone rather than
  a file removal so that retired UIDs remain visible and are never reused.
normative: true
links:
- target: UR-0027
  type: implements
attrs:
  priority: must
  verification: test
  origin: hybrid
  invalidated_reason: 'Superseded by tl resolve (SR-0006, SR-0248, SR-0250): a UID
    allocated on two branches is detected when they merge and the later item is renumbered,
    with the links to it rewritten. GUID identity was never built, and SR-0123 contradicts
    SR-0154, which is what the fingerprint does. The one cost is accepted: an item
    signed on a branch and then renumbered at the merge is signed again. Decided
    by Henry Grech-Cini on 14 November 2026.'
