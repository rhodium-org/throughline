uid: SR-0114
type: system_requirement
status: rejected
title: Full-clause mirror of referenced external items in documents
text: 'The tl:sourced document directive shall render, in full, the distinct external
  clauses that the items matching its SR-0045 filter reference by a namespace-qualified
  link target — each rendered as the same full block a tl:item marker produces, in
  target order, the blocks separated by a blank line. Each block is obtained through
  the optional target resolver (SR-0110): a composing front end supplies a resolver
  that renders the borrowed clause from its source, so a composed document can mirror
  the upstream clauses it depends on in one place. A target the resolver cannot render
  is omitted; when nothing resolves — no such references, or no source-backed resolver
  — the directive renders a clear placeholder rather than an error. The clauses a
  tl:sourced block mirrors belong to their sources, so the directive does not publish
  the local items its filter selects for the coverage rule (SR-0096). A malformed
  filter fails injection.'
rationale: 'Retired: the capability moves to throughline-compose, which holds the
  sources the directive needs. Core carried this renderer while nothing in core could
  satisfy it — its only unaided output was a placeholder naming another program,
  and running bare tl docs over an already-rendered composed document silently replaced
  the mirrored clauses with that placeholder and exited successfully. Rather than
  specify that degradation more carefully, the directive is provided by the layer
  that can actually render it, registered through the seam in SR-0186; core keeps
  only the duty to recognise the marker and say it does not provide it. The principle
  is recorded as NG-0007. The mirror itself is not withdrawn — it is owned by throughline-compose
  from here.'
normative: true
