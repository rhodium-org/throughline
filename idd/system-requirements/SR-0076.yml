uid: SR-0076
type: system_requirement
status: ratified
title: CLI version reporting
text: The Tool's CLI shall report its own version via a --version flag, printing
  the installed package version and exiting 0, so users and CI can record which build
  produced a result (supports the SemVer compatibility surface, NFR-0011).
