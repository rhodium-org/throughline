uid: SR-0360
type: system_requirement
status: proposed
title: No status change leaves the tombstone status
text: tl status, and the operation every command sets a status through, shall refuse
  to move an item out of the status bound to the tombstone role, whatever transitions
  the project declares and where it declares none, naming tl restore. Declining a
  deletion with tl restore (SR-0268) shall be the only way an item leaves that status.
rationale: 'Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. A proof of the specification''s guarantees found, and a run on 6.0.0
  confirmed, that in a project declaring no transitions tl status moved a signed
  tombstone to any live status and removed its deletion record: a retirement a person
  had signed was undone with no signature withdrawn and no record. A project that
  declared a move out of the tombstone status could do the same to an unsigned one.
  The owner decided on 16 November 2026 that status never leaves the tombstone status.
  Rejected: refusing only where no transitions are declared, which leaves a declared
  row able to undo a deletion without restoring the status the item held. Who pays:
  a project that declared a transition out of its tombstone status and used tl status
  to revive an item uses tl restore instead, which returns the status the item held
  and not one chosen.'
