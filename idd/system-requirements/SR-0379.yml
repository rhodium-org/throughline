uid: SR-0379
type: system_requirement
status: ratified
title: An item may be built before it is signed
text: The lifecycle tl init writes, and every standard this repository publishes,
  shall allow proposed to move to implemented. tl migrate shall add that move to
  a project's own transitions where the status of the ratified role may move into
  a built status and the proposed one may not.
rationale: 'Today tl status refuses proposed to implemented, so built ahead of agreement
  cannot be recorded (found 22 November 2026, rhodium-org/throughline#186). Whether
  that is allowed to land is the gate''s question (UR-0051), not the status table''s.
  Rejected, removing the ratified status so status carries building alone: every
  follower graph, standard and tool counts by it, and the cost is not yet shown to
  be worth it; the signature already carries agreement, so the ratified status now
  only says agreed and not built. Who pays: projects with their own transitions table,
  which gain one move through tl migrate.'
normative: true
