uid: SR-0107
type: system_requirement
status: ratified
title: Namespace-qualified references fail fast toward composition
text: A reference target of the form <namespace>:<UID> — a namespace name, a colon,
  and an otherwise-valid UID, for example gds:SR-0001 — asserts that the target resolves
  inside a source the project declares. Where the project declares that namespace,
  the reference shall resolve into the union (SR-0230). Where it declares no such
  namespace, tl check shall recognise the form from the reference alone and fail,
  naming the namespace nothing declares, rather than report an ordinary dangling
  link to a missing local UID. Free external references — a URL, a repository path,
  or any other out-of-graph pointer (SR-0031) — shall stay opaque and shall not trigger
  this rule, because being unresolvable is those forms' intended purpose.
rationale: |-
  Without a distinct rule the namespace-qualified form falls through to the dangling-link check (SR-0032) and is reported as a missing local UID, which sends a composer hunting for a typo when the real remedy is a declaration. Recognising the syntax as a first-class token turns the wrong answer into a signpost to the right one.

  Amended 2026-09-18 when composition moved into the Tool. The text as ratified said the core performs no composition and stays source-unaware, and pointed the composer at a second tool. The Tool now composes (SR-0230), so the finding points at the declaration to add. The distinct finding itself is unchanged.
