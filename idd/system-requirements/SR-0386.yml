uid: SR-0386
type: system_requirement
status: ratified
title: tl check says when migrating would turn on the built axis
text: Where a project names no built role and declares the statuses implemented and
  verified, tl check shall end with one line saying that tl migrate would bind the
  built role and date the items in those statuses from history, with how many there
  are. It is a note, not a finding, and changes no exit code.
rationale: 'tl migrate is the one command that turns the built axis on (SR-0377,
  SR-0383), and nothing told a graph''s keeper it had anything to do. Rejected, migrating
  automatically when a graph is read: on throughline''s own graph it rewrote 214
  files, and tl check runs read-only in CI and inside other tools, so it would put
  changes in working trees nobody asked for and date records behind people''s backs.
  The note follows the earlier filter language''s (SR-0339). Who pays: nobody; one
  line.'
normative: true
