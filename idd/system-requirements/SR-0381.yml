uid: SR-0381
type: system_requirement
status: ratified
title: tl adopt records when a graph was laid over existing work
text: 'tl adopt shall set adopted under [project] to a UTC time (now, or --at), and
  mark the items it is given, or with --all every live item, as built with an implementations
  entry at that time, by the person running it, at the current revision, with adopted:
  true. Run again with the same time it shall change nothing.'
rationale: 'One date separates existing work from work done after the graph (UR-0050),
  so the gate needs no mode. Marking the items built in the same command keeps the
  date and the records consistent. Rejected, inferring adoption from the earliest
  commit of the graph: a graph is often written over weeks before it is meant to
  govern anything. Who pays: whoever lays a graph over an existing project runs one
  command.'
normative: true
