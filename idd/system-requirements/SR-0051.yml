title: Traceability views
text: 'Publishing shall include generated traceability views rendered into Markdown
  by reference: a table view and a traceability matrix between two registers/link
  types. Graphical exports (e.g. DOT/Graphviz) are out of scope (NG-0005); a
  wrapper may derive them from the JSON dump (SR-0055).'
