uid: SR-0346
type: system_requirement
status: implemented
title: A project whose filters are GQL is refused by a Tool that cannot read them
text: A project whose filter_language is gql shall declare on-disk format version
  5 or higher, and the Tool shall refuse a project that declares gql at a lower version,
  saying so. The Tool shall read a project at format version 4, whose filters are
  in the earlier language, and one at version 5, without asking either to migrate.
  tl init shall write the version its configuration needs (SR-0385), and tl migrate
  --to-gql shall raise it to 5 where it is lower. A Tool older than this requirement
  refuses version 5 as a format it does not understand, naming the upgrade.
rationale: 'Found building SR-0339, when throughline''s own graph was moved and checked
  by the released Tool: an older tl does not know the filter_language key, reads
  each GQL marker as a filter of the earlier language that fails to parse, and treats
  a failed filter in a document as selecting nothing. It reported 234 items unpublished
  and refused nothing. A wrong answer with no refusal is the worst outcome for a
  graph read by a pinned Tool, a hosted service or another person''s machine. The
  format version is what an older Tool already checks and refuses on (NFR-0010),
  so a moved graph says version 5. SR-0337 rejected a new version because it would
  stop unmoved graphs loading; this does not: version 4 is still read as it is. Who
  pays: a moved graph, and every graph tl init makes from now on, can only be read
  by a Tool at or above this release; a keeper who moves a graph upgrades the Tool
  wherever that graph is read, first.'
normative: true
