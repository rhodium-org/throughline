uid: SR-0251
type: system_requirement
status: ratified
title: tl dump states each item's current fingerprint and revision
text: 'Each item in the canonical dump shall carry, under documented keys, the fingerprint
  the Tool computes for its current normative content and a revision: a digest of
  its whole stored record that changes when any field does, so a reader of the dump
  can quote back exactly which version of the item it read.'
rationale: 'An assistant or agent working from an export has to tell apply which
  version of an item it drafted against. The fingerprint alone cannot: it covers
  only normative content, so a newer title, rationale, link, status or non-normative
  attribute leaves it unchanged and a stale change would be written over the newer
  one. The revision covers the whole record; the fingerprint stays, because ratification
  is taken over it. Computing either anywhere but here would re-implement the rule,
  so a tool that builds the export (rhodium-org/throughline-ms-copilot for Microsoft
  365 Copilot, for one) takes both from the dump rather than hashing items itself.
  Stays inside NG-0005: it widens the dump SR-0055 already sanctions and adds no
  format.'
normative: true
