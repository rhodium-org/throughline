uid: SR-0015
type: system_requirement
status: ratified
title: Rich text in statements
text: Item text fields may hold CommonMark Markdown, including tables, lists, code
  blocks, and images by relative path. The Tool shall carry it exactly as written,
  in the item's file and in generated documents, and shall neither interpret nor
  validate it.
