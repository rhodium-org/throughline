uid: SR-0368
type: system_requirement
status: ratified
title: tl migrate --beneath refuses a path that is not there
text: tl migrate --beneath shall refuse a PATH that does not exist, naming it, before
  anything is searched.
rationale: Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. A path that was not there was silently replaced by its parent, whose
  graphs were then listed and, with --apply, migrated.
normative: true
