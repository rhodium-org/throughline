uid: SR-0260
type: system_requirement
status: ratified
title: An item is ratified when its signatures meet what its kind requires
text: The Tool shall treat an item as ratified only when its current signatures satisfy
  the requirement declared for its type. Until they do, each signature shall be recorded,
  the status shall not move, and check shall report a named finding, awaiting-signatures,
  saying which roles have signed and what is still required; the worklist shall list
  the item as awaiting a human. When the requirement is met, what happens to the
  status shall follow SR-0172. The finding shall be suppressible as any rule is.
rationale: A visible intermediate state without a new status. Rejected, a status
  such as part-signed, which every project would have to add to its vocabulary and
  transitions before the first second signature, and which SR-0172 shows is the wrong
  axis; a status describes agreement or progress, and a count of signatures describes
  neither. The finding and the worklist already exist to say an item awaits a human,
  and the brief already teaches them. Who pays, nobody new; a project that declares
  no requirement never sees the finding.
normative: true
