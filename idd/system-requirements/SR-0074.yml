uid: SR-0074
type: system_requirement
status: ratified
title: CLI invocation must not silently collide with existing tools
text: The Tool's installed command shall not silently shadow, or be shadowed by,
  a standard system utility of the same name (e.g. the POSIX 'rmt' tape tool). The
  Tool shall either ship a non-colliding invocation name, or detect the clash at
  install / first run and warn the user with remediation. A newcomer's first command
  must run the Tool, not an unrelated utility.
normative: true
links:
- target: UR-0020
  type: implements
attrs:
