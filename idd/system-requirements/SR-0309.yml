uid: SR-0309
type: system_requirement
status: ratified
title: The brief says every item is proposed until a person signs it
text: The brief tl context generates shall state that every item is born proposed
  whatever its origin; that it counts only once a person has signed it, implemented
  and verified items included; that a signature is the only agreement; and that tl
  ratify signs an item where it stands when the ratified status is out of reach.
  It shall describe drafts only for a project that keeps an initial status apart
  from the proposed one.
rationale: 'The brief told agents only that machine-origin items are provisional,
  so an agent moving its own human-labelled work to implemented had no reason to
  expect the gate to want a signature. Who pays: nobody; it is the brief agreeing
  with the gate.'
normative: true
links:
