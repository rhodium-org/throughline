uid: SR-0073
type: system_requirement
status: ratified
title: Grounding-assisted authoring
text: When creating a non-root item, the Tool should help the author attach it to
  a valid parent at creation time (offering the existing roots and grounding candidates
  to link against), so an item is grounded at birth rather than caught as an orphan
  by a later check. Interactive prompts are optional and non-blocking; the same operation
  stays scriptable via flags.
