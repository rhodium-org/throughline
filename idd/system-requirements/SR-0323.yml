uid: SR-0323
type: system_requirement
status: ratified
title: tl init --from-schema copies the standard's signed guidance and refers to
  it from AGENTS.md and CLAUDE.md
text: 'When tl init --from-schema names a standard that holds guidance items (meta-standard
  REG-0010), init shall copy each guidance item''s file, as it is at the source''s
  --ref, to that item''s copy_to path in the new project, where the item is ratified
  and its signature still holds over the file (SR-0322). A guidance item that is
  unsigned, or whose file changed after it was signed, is not copied, and init warns,
  naming it. Init shall then make AGENTS.md refer to each file it copied, by its
  path from that AGENTS.md, and CLAUDE.md beside it import AGENTS.md. These two are
  the ones at the root of the git working tree that holds the new project, or at
  the project''s root where it is in none. Init creates either file where there is
  none, and adds to the end of one that exists only the lines it lacks. Init shall
  not replace or remove anything in a file that exists: where a copy_to path already
  holds other content, init keeps that file, warns naming it, and carries on. Init
  shall name every file it created or added to.'
rationale: 'Guidance items, not a fixed path: the standard declares what it gives
  its followers and where each copy goes, and a person signs it like every other
  declaration, so nothing unsigned reaches a follower. Copied once and then the follower''s
  own, like the registers (SR-0296). An agent reads only the files its framework
  loads by itself when a session starts (CLAUDE.md for Claude Code, AGENTS.md for
  most others), and it loads them from where the session starts, which is the repository''s
  root, not the graph''s folder. So guidance under a name of its own, such as idd/glossary-guidance.md,
  is read by nobody until the root''s files refer to it, and the estate keeps its
  graphs in idd/ (operator, 13 Nov 2026). Existing files are added to, not refused
  (operator, 13 Nov 2026), which replaces the decision of 3 Nov 2026 to halt: halting
  left a graph started beside an AGENTS.md with no guidance at all. Rejected: agent
  files inside the graph''s folder, which a session started at the root loads only
  once it works there; writing the guidance text into AGENTS.md, which mixes signed
  text with the follower''s own and cannot be compared with a later version of the
  standard; replacing an existing file, which loses the follower''s instructions.
  Who pays: init writes up to two files outside the folder it was given, in a repository
  whose owner may not expect it, so it names each one; a follower finds a line or
  two added to agent files it already had.'
normative: true
