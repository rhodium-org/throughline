uid: SR-0306
type: system_requirement
status: ratified
title: tl init --from-schema copies the standard's signed guidance for followers
text: When tl init --from-schema names a standard that holds guidance items (meta-standard
  REG-0010), init shall copy each guidance item's file, as it is at the source's
  --ref, to that item's copy_to path in the new project, where the item is ratified
  and its signature still holds over the file (SR-0308). A guidance item that is
  unsigned, or whose file changed after it was signed, is not copied, and init warns,
  naming it. Where a copy_to path already exists in the new project, init shall warn,
  naming the file, write nothing, and exit with a usage error.
rationale: 'Guidance items, not a fixed path: the standard declares what it gives
  its followers and where each copy goes (AGENTS.md for the presentation standard),
  and a person signs it like every other declaration, so nothing unsigned reaches
  a follower. Copied once and then the follower''s own, like the registers (SR-0296).
  An existing file halts init rather than being kept or merged (operator, 3 Nov 2026):
  the follower would start without the guidance its standard''s consumers rely on,
  or lose instructions of its own, and either should be a person''s choice; halting
  before anything is written follows SR-0283.'
normative: true
