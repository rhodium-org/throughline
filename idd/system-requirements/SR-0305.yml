uid: SR-0305
type: system_requirement
status: ratified
title: tl check names tl migrate beside an error a repair resolves
text: 'When tl check reports a finding that a repair tl migrate would apply to the
  graph resolves (SR-0137), such as an unsigned tombstone that history can attribute
  (SR-0273), it says so once after the findings: how many of them tl migrate resolves
  and the command to run. It does not run the repair, and it does not change any
  finding''s severity or the exit code.'
rationale: 'An error that a repair resolves reads, without this, as work for a person:
  SR-0273''s backfill existed for every tombstone the 4.1.0 gate reported, and the
  report never named it, so operators were sent to sign by hand what history already
  attributed. Costs a consumer one line of output on a graph a repair would change;
  a graph none would change sees nothing. Rejected: running the repair from check,
  which would make the gate write.'
normative: true
