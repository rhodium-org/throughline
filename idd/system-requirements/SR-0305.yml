uid: SR-0305
type: system_requirement
status: implemented
title: The lifecycle tl init writes has no status that claims agreement without a
  signature
text: The configuration tl init writes shall declare no status that says an item
  is agreed except the one bound to the ratified role, so an item reads agreed only
  where tl ratify has recorded who accepted it. Every live status shall keep a route
  to the ratified status, the initial and parked statuses through the proposed one,
  and a route to the suspect status. The starter graph shall seed every item in the
  status bound to the initial role, since no person has signed it.
rationale: 'approved is bound to no role in [status.roles]: no tl operation writes
  or reads it, so an item in it claims an agreement no signature records. The operator,
  7 November 2026: proposed is the case whether a person, a person with an AI, or
  an AI proposed the item (who did is its origin attribute), and approved means nothing
  unless it is ratified. The shipped table also offered proposed -> approved, the
  one-command escape SR-0149 had to catch after the fact. Removing it leaves draft
  and deferred reaching ratified through proposed, so SR-0150 and SR-0175 still hold.
  The starter items were seeded approved for the same reason; seeding them ratified
  instead would claim a signature nobody gave, so they start in the initial status.
  Who pays: only new projects; an existing configuration is untouched (SR-0307).
  Rejected: binding approved to a new role, which would give a name to the same unbacked
  claim.'
normative: true
