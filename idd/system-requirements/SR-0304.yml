uid: SR-0304
type: system_requirement
status: implemented
title: tl migrate --beneath --apply migrates every graph or none, and commits nothing
text: With --apply, every graph that is due and not skipped is migrated by the same
  lossless migration tl migrate applies to one graph, without resolving its sources.
  Nothing is committed. One line per repository names how many graphs were migrated
  there, so that its owner reviews and commits them. Where a graph fails to migrate,
  it is named with the reason, every graph the run had migrated before it is put
  back as it stood and named, no further graph is migrated, and the command exits
  1.
rationale: 'Amended 16 November 2026. The requirement as first written carried on
  past a graph that failed and kept the others migrated; both independent builds
  of the Tool write nothing unless the whole change succeeds, and the owner decided
  tl does the same. Who pays: one graph with no migration path stops --apply for
  the graphs found with it, until it is mended or the others are migrated one at
  a time with tl -C <graph> migrate, which the refusal says.'
normative: true
