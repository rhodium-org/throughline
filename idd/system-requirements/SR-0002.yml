uid: SR-0002
type: system_requirement
status: ratified
title: UID format
text: The Tool shall form UIDs as <PREFIX>-<NUMBER> where PREFIX is the owning register's
  configured prefix and NUMBER is a zero-padded positive integer of configured width
  (default 4).
rationale: A mandatory separator keeps UIDs unambiguous and sortable; grammar in
  doc 06 §3.
normative: true
links:
- target: UR-0001
  type: implements
attrs:
  priority: must
  verification: test
  ratified_by: Henry Grech-Cini
