uid: SR-0380
type: system_requirement
status: ratified
title: The strict check refuses built and unsigned work, except work the graph was
  laid over
text: tl check --strict shall report an error for an item in a built status whose
  signatures do not meet what its type requires, unless its first implementations
  entry is no later than the project's adopted time; such an item it shall report
  as a warning, awaiting acceptance.
rationale: 'Keeps UR-0046''s rule that built work needs a signature, judged on the
  record rather than the status name, and lets a graph laid over existing work pass
  its gate while its items wait to be accepted. Work in progress may hold built unsigned
  items; the strict check is what a pull request lands through, so they cannot reach
  the main line. Rejected, a warning for every built unsigned item: that would let
  agent work land unagreed. Who pays: nobody new; adopted graphs stop failing a gate
  they could never pass.'
normative: true
