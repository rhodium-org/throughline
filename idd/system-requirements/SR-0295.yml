uid: SR-0295
type: system_requirement
status: proposed
title: The dump marks what the standard declares
text: tl dump of a follower shall mark each register, attribute and link that its
  standard declares with the UID of that declaration. Those the follower declares
  for itself carry no mark.
rationale: 'An app reads only what its standard declares; the mark lets it skip the
  follower''s own additions without re-implementing the check (operator, 1 Nov 2026:
  mark only what the standard declares).'
normative: true
