uid: SR-0045
type: system_requirement
status: ratified
title: Filter expression language
text: The Tool shall provide one boolean filter language over an item's `uid`, `type`,
  `status`, `register`, `title`, `text`, `rationale`, `normative`, `derived`, `attrs`
  and `links`, usable identically in search, table generation, exports, and coverage
  rules.
rationale: 'The list named tags, which the Tool has never had, and left out uid,
  rationale, normative and derived, which it admits (issue #40). The names are written
  out exactly because a reader reproducing the language needs the set, and SR-0103
  bounds what the parser may read by it. Tags came from the filter strings other
  tools offer and were never built, so UR-0010 no longer promises them.'
normative: true
links:
- target: UR-0010
  type: implements
- target: SR-0103
  type: relates
attrs:
  priority: must
  verification: test
