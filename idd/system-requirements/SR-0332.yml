uid: SR-0332
type: system_requirement
status: proposed
title: A borrowed item whose UID is not well formed is refused by name
text: When a composed source holds an item whose UID does not fit the UID grammar,
  the Tool shall refuse to compose, naming the source and the item, and never stop
  with an unhandled error.
rationale: 'Such an item cannot be given a namespaced name, and release 5.3.0 stops
  with a Python error when it tries. A standalone check of the source reports it
  as uid-grammar. Who pays: a consumer of such a source is told which item to have
  corrected.'
normative: true
