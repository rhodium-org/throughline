uid: SR-0361
type: system_requirement
status: ratified
title: A refusal to read a revision says what the command was asked to do
text: Where a command that reads the graph at a git revision is run outside a git
  work tree, its refusal shall say what that command does with the revision. tl diff
  shall not be refused in the words for rendering a document.
rationale: Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. tl diff outside a repository said it could not render --at HEAD, an option
  tl diff does not have.
normative: true
