uid: SR-0366
type: system_requirement
status: proposed
title: A register left untyped does not end a migration early
text: Where tl migrate ends with a register still declaring no item type (SR-0350),
  it shall still make the pass over the union in a project that declares sources,
  give the advice it gives after any migration, and exit 1.
rationale: Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. In a project with sources the finding ended the command before the union's
  pass and the advice, though SR-0350 says the migration is kept and the rest of
  the advice still holds.
