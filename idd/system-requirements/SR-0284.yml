uid: SR-0284
type: system_requirement
status: deleted
title: A standard may declare the registers its followers start with
text: A project's configuration may declare [[starter_registers]], each a table of
  prefix, dir (a folder inside the project), type (a type its schema declares) and
  an optional title (by default the folder). Prefixes and folders are unique, and
  a bad entry is refused when the configuration is read. When tl init --from-schema
  names that project, init shall create those registers in the new project. They
  are then the follower's own registers, created once and never resolved from the
  source again, so a follower may add, rename or drop them. A schema source that
  declares none gives a project with no registers, and init says so.
rationale: 'Registers hold the follower''s own items in the follower''s own folders,
  so unlike the schema they are not inherited on every read: changing a standard''s
  suggested prefix must never move a follower''s files. Declared in the standard,
  not inferred from its types, because a type is not a folder (a standard may expect
  two registers of one type, or none for a type kept for its own examples). Naming
  an undeclared type is refused when the standard''s configuration is read.'
normative: true
