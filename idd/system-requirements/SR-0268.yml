uid: SR-0268
type: system_requirement
status: ratified
title: An unsigned tombstone can be restored to the status it held
text: tl restore <UID> shall return an unsigned tombstone to the status its record
  says it held, removing the deletion record and touching no signature. It shall
  refuse a tombstone whose deletion is ratified, saying that a signed deletion is
  permanent while its signature stands and that withdrawing that signature with tl
  withdraw, then restoring, undoes a deletion signed in error; that is the only way
  one is undone. It shall refuse a tombstone retired outright, and one whose record
  does not say what status it held. The transition gate shall accept the restore
  of a tombstone that was unsigned at the baseline, since the item is back where
  the lifecycle last left it.
rationale: 'A proposed deletion a reviewer declines must be undoable without a hand
  edit, and the item''s own signatures still cover its content, so nothing is re-signed.
  A record nobody has accepted is a proposal, not a death record. The refusal used
  to say a tombstone is permanent and then name tl withdraw, which reopens it: a
  proof of the specification found the two could not both hold. The owner decided
  on 16 November 2026 that withdrawing the deletion''s signature and then restoring
  is the intended way, and the only one, to undo a deletion signed in error, so the
  wording is permanent while its signature stands. The file itself is never removed
  (SR-0093).'
normative: true
