uid: SR-0120
type: system_requirement
status: implemented
title: Guided interactive prompting for missing details
text: 'When a command is run without a detail it requires, the CLI shall behave by
  the session it is in. On an interactive terminal (stdin and stderr are a TTY) it
  shall prompt for the missing detail rather than fail, stating in plain language
  what it needs and why it needs it, offering a sensible default or a skip where
  one is safe, so an unsure user is guided to a correct command instead of having
  to already know the flag grammar. When the session is not interactive — a pipe,
  a redirect, or CI — it shall not prompt; it shall fail fast with a usage error
  that names the missing detail and the flag that supplies it, so automation never
  hangs waiting on input and never silently guesses. Prompting for a value is an
  aid to discovery, not a second way to configure the tool: every value obtainable
  through a prompt shall remain settable by a flag, and a fully specified command
  shall never be prompted for a value. Asking a user to confirm an act is not prompting
  for a value and is not governed by that rule — where a command records an accountability
  that cannot be withdrawn, it may require confirmation on an interactive terminal
  however fully it was specified, and shall require none where the session is not
  interactive.'
rationale: |-
  A newcomer does not yet know the flag grammar, and forcing them to read usage output for every argument is exactly the friction UR-0020 forbids; a tool that asks clear questions turns the first uncertain command into a guided success. But the same tool must stay a first-class automation citizen (UR-0016, SR-0060) — a prompt that blocks in CI is a hang, and a default silently chosen for a piped command is a wrong answer nobody agreed to. Keying the behaviour off the TTY, and keeping every prompt backed by a flag, lets one code path serve both the guided human and the scripted pipeline without either compromising the other.

  The confirmation carve-out separates two things this requirement had treated as one. A prompt for a value is a way of configuring the command, and the rule against prompting a fully specified command protects the flag grammar from becoming optional. A confirmation configures nothing — it asks whether to proceed with an act the command already fully describes — so forbidding it on a fully specified command protects nothing and denies the tool its only means of putting a stop in front of something irreversible. SR-0167 already required such a confirmation and SR-0195 now does too, so the alternative was two requirements each deviating from this clause without saying so.

  Scoped to an accountability that cannot be withdrawn rather than granted generally, because a confirmation asked for routinely is the dialogue everyone learns to dismiss, and the value of the stop is that it is rare. Left permissive (may) rather than mandatory, so what warrants a stop stays the judgement of the requirement that describes the act. Still forbidden without a terminal, which is the automation guarantee above and is not weakened here.
