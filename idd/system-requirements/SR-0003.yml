uid: SR-0003
type: system_requirement
status: ratified
title: No UID reuse
text: The Tool shall never assign a UID that has ever existed in the project, including
  UIDs of deleted items. A deleted item's file stays as a tombstone, so allocation,
  which takes the next number above every one in use, passes over it; a number a
  register's manifest reserves is passed over likewise.
normative: true
