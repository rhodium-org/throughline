uid: SR-0364
type: system_requirement
status: proposed
title: tl resolve keeps the line endings of the files it rewrites
text: An item file tl resolve renumbers, relinks or settles the signatures of shall
  be written back with the line endings it was read with.
rationale: Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. A file with CRLF line endings came back with LF, every line changed in
  the diff of a merge that moved one UID. The rewrite was already made line by line
  to keep the layout; the files were read and written in text mode, which translated
  the endings on the way.
normative: true
