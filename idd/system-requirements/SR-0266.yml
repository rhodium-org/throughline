uid: SR-0266
type: system_requirement
status: ratified
title: A format refusal is typed, carrying both majors and the file read
text: When the Tool declines a project because its format major differs from the
  major the Tool implements — on loading it, reading it as a source or migrating
  it — the refusal shall be a FormatError, a ProjectError the package exports, carrying
  the major the project declares, the major the Tool implements and the configuration
  file read. The message shall stay the terminal's account that SR-0168 requires.
rationale: 'A host that carries the Tool somewhere other than a terminal — a page
  running it in a browser — cannot show the message: it names a path inside the browser''s
  file system and a pip command for an interpreter the reader does not have, and
  the reader does not care how the page is built (seen on table.iddn.uk, 2026-10-25).
  Matching the message''s words instead would be a second copy of the rule, unwatched,
  that breaks when the words change. A typed error with the three facts lets the
  host say which side is behind and what to do, in its own words. Rejected — changing
  the message itself: the terminal''s account is right for a terminal and SR-0168
  requires it. Rejected — a code attribute on ProjectError: one subclass is the plainer
  contract, and it stays a ProjectError so every existing handler still catches it.
  Who pays — a host that wants its own words adds one isinstance check; one that
  does not notices nothing.'
normative: true
