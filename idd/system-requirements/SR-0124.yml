uid: SR-0124
type: system_requirement
status: rejected
title: Human UID allocated atomically at integration
text: A human UID shall be allocated when a branch integrates into the trunk, as
  the next unused number over the trunk's used numbers, committed under compare-and-swap
  on the trunk ref; a losing race re-allocates against the updated trunk and retries.
  Items carry only a GUID until integration.
normative: true
links:
- target: UR-0026
  type: implements
attrs:
  priority: must
  verification: demonstration
  origin: hybrid
  invalidated_reason: 'Superseded by tl resolve (SR-0006, SR-0248, SR-0250): a UID
    allocated on two branches is detected when they merge and the later item is renumbered,
    with the links to it rewritten. GUID identity was never built, and SR-0123 contradicts
    SR-0154, which is what the fingerprint does. A signature given before a merge
    is kept safe by ratifying on the main branch. Decided by Henry Grech-Cini on
    14 November 2026.'
