uid: SR-0279
type: system_requirement
status: ratified
title: The reported schema says where each declaration came from
text: The brief, the schema listing and the dump shall show the project's schema
  as formed from its schema source and mark each inherited declaration with that
  source's namespace. A schema operation asked to change an inherited declaration
  shall refuse before writing anything, naming the source to change instead.
rationale: 'An agent reading the brief must see the rules it is checked by, wherever
  they are declared, and must not edit a follower''s configuration to change a rule
  the standard owns. Follows SR-0181''s refusal to change another graph''s schema.
  Who pays: nobody new.'
normative: true
