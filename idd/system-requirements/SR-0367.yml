uid: SR-0367
type: system_requirement
status: ratified
title: tl init writes any project name as valid configuration
text: tl init shall write the name it is given so that the configuration reads back
  with that name, whatever characters the name holds.
rationale: Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. tl init --name with a double quote or a backslash wrote a configuration
  that was not TOML, and ended in a traceback reading it back.
normative: true
