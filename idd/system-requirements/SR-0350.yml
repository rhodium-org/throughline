uid: SR-0350
type: system_requirement
status: ratified
title: Migration ends with findings while a register declares no item type
text: When a register still declares no item type after migration's repairs, migration
  shall name each such register, with the command that declares its type, and shall
  end with findings, keeping every repair it made. Migrating the graphs beneath a
  path shall name each graph holding such a register and end with findings in the
  same way, whether it lists the graphs or migrates them.
rationale: |-
  Found with SR-0349: a graph whose empty registers declare no item type migrates cleanly today and fails later, at the first `tl new` in one of them, often in a script or a skill far from the migration. Migration is where a keeper brings a graph up to what the Tool expects, so it is where an untyped register is reported, each with the line that types it. The repairs are kept, as for every other finding, so the run after the registers are typed has nothing left to do.

  Who pays: a graph with a register that declares no item type and that migration cannot type, which now migrates with findings (exit 1) until `tl register type` declares one; CI or scripts that run `tl migrate` see it.
normative: true
