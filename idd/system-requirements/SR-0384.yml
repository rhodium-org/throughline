uid: SR-0384
type: system_requirement
status: ratified
title: A request for a signature says whether it agrees a plan or accepts what exists
text: tl ratify shall state, for each item before asking, either that the signature
  agrees work not yet built, or that it accepts work built at a given time from a
  given revision, and tl dump shall carry each item's implementations list so that
  every other front end can say the same.
rationale: 'Signing a plan and accepting work already done are different judgements;
  on 22 November 2026 signatures given at review read as plans agreed (rhodium-org/throughline#186).
  tl-ratify draws from the dump, so carrying the record there is what lets it show
  the line; its own change belongs to its repository. Who pays: front ends that ask
  for signatures, one more line each; dump consumers, one more field.'
normative: true
