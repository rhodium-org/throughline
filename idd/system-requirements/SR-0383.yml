uid: SR-0383
type: system_requirement
status: implemented
title: tl migrate dates the built work a graph already holds
text: 'For an item in a built status with no implementations list, tl migrate shall
  write one entry dated from the first commit in which the item entered that status,
  by that commit''s author, at that commit, with backfilled: true; where history
  cannot say, it shall write none and name the item. It is idempotent.'
rationale: 'Existing graphs hold hundreds of implemented items (throughline has 106)
  whose building has no record; without one they cannot be ordered against their
  signatures. Git history is the best evidence there is and is marked as such, as
  backfilled signatures are. Rejected, dating them all at migration time: that would
  claim they were built after they were signed. Who pays: the first migrate after
  this release takes longer on a long history.'
normative: true
