uid: SR-0348
type: system_requirement
status: proposed
title: The check summary counts a root served as the finding does
text: 'The check summary shall count the delivery roots served by the rule the unserved-root
  finding is reported by (SR-0344), so that a root only dead items ground into is
  not counted as served: in a project on its own and, for the project''s own delivery
  roots, in a composed one.'
rationale: 'tl 5.10.0 prints 3/3 delivery roots served beside an unserved-root error:
  the summary counts any grounding link into a root, and since SR-0344 the finding
  counts only live items. The owner has not ruled on this; it is proposed apart from
  SR-0347 so that it can be declined alone. Rejected: leaving dead roots and dead
  items out of the totals, which would change every figure in the line and what SR-0078
  says is counted. Who pays: nobody''s gate changes; a summary that printed a full
  count beside the error prints the count the error implies.'
normative: true
