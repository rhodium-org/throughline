uid: SR-0382
type: system_requirement
status: ratified
title: A filter can read when an item was built and when it was signed
text: 'A filter shall be able to read, for each item: built, true when it is in a
  status of the built role; built_at, the time of the entry that last put it there,
  or null; signed_at, the time of the latest signature that stands, or null; and
  adopted, true when it was built no later than the project''s adopted time. Each
  is the judgement tl check makes (SR-0335).'
rationale: 'With these, the four cells and the order of the two are a query, for
  example built and not signed, or built_at before signed_at, without reading the
  records. Who pays: nobody; four more read-only properties.'
normative: true
