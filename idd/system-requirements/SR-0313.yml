uid: SR-0313
type: system_requirement
status: ratified
title: tl migrate retires the statuses that stood between proposal and signature
text: For a project whose own configuration declares its statuses, tl migrate shall
  retire every status bound to no role that the proposed status may move to and that
  may move to the ratified status, and the initial status where it is not the proposed
  one. Each item in a retired status moves to the ratified status where its signatures
  meet what its kind requires and ratification moves the status, and to the proposed
  status otherwise; no signature is added or removed. The retired statuses leave
  the status values and the transitions, where a move into one becomes a move into
  the proposed status, and the initial role is bound to the proposed status. It is
  idempotent, reports each item moved, and leaves a project whose statuses come from
  a schema source to that source.
rationale: 'Existing graphs hold items in approved and draft, and the shipped lifecycle
  no longer has either. A repair in tl migrate, not a script beside it, keeps the
  change idempotent and in the tool. The statuses are found by their place in the
  lifecycle, never by name (SR-0131): a project that called its unsigned agreement
  ''accepted'' has the same limbo. An item whose signatures already stand is ratified,
  which is where ratify would have put it. Rejected: signing the moved items, which
  would put a name on agreements nobody gave. Who pays: adopters, whose moved items
  wait for a signature, and whose comments in the configuration may still name the
  retired statuses.'
normative: true
