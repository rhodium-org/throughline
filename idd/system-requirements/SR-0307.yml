uid: SR-0307
type: system_requirement
status: proposed
title: tl context includes the schema source's guidance at its pinned version
text: Where a project's schema source holds follower/AGENTS.md, tl context shall
  include that file, as it is at the pinned ref, under a heading naming the source
  and its ref, after the schema source section.
rationale: 'The copy SR-0306 makes is as old as the init; when the follower moves
  its pin, the copy does not move. Printing the guidance in tl context at the pinned
  ref means the brief an agent is told to read first always matches the standard
  the graph is checked against, so the copied file never needs to be kept in step
  by hand. Who pays: a longer brief for followers of a standard with guidance; nothing
  for any other project.'
normative: true
