uid: SR-0186
type: system_requirement
status: ratified
title: Document directives resolve through one registry, and an unprovided directive
  fails by name
text: 'Document injection shall recognise a marked region by its general form — a
  tl: marker naming a kind, with an optional modifier — rather than by an enumeration
  of kind names built into the pattern that finds it, and shall resolve each kind
  through a single registry carrying, for that kind, how it renders and whether it
  publishes the items its filter selects for the coverage rule (SR-0096). One registry
  entry shall be the only place a directive is declared, so a directive cannot be
  recognised for rendering while being omitted from the coverage question, or the
  reverse. A front end built on throughline may register a directive of its own,
  so a capability depending on state core does not hold is provided by the layer
  that holds it rather than stubbed inside core (NG-0007). A marked region naming
  a kind no registered directive provides shall fail injection, naming the kind and
  the document it appears in, and stating that directives beyond core''s own are
  registered by front ends built on throughline, so an author who has run the wrong
  command is told what is missing rather than that the document has unbalanced markers;
  no file shall be written. Core shall hold no mapping from a directive to the front
  end that provides it.'
rationale: 'A directive is currently declared in five places — two regular expressions,
  a tuple of kind names, a set of non-publishing kinds, and a dispatch chain — which
  must all agree for it to behave correctly, and nothing enforces that they do. Because
  recognition happens in the pattern rather than at dispatch, a kind the running
  tool does not provide is not merely unrendered: its marker fails to match, its
  tl:end is counted as an opener without a partner, and the author is told the document
  has unbalanced markers rather than that the directive belongs to another command.
  Making the registry entry the unit of declaration removes the duplication, lets
  injection report what is actually wrong, and gives a front end a supported way
  to add a directive instead of core carrying a stub for state it does not hold.'
normative: true
