uid: SR-0238
type: system_requirement
status: ratified
title: The default resolver fetches only what a source needs
text: 'The default resolver shall fetch a url source as a partial clone: a blobless
  clone at depth one, with a sparse checkout limited to the source''s subdir where
  one is declared, and to the document paths the source''s throughline.toml declares
  under [docs]. Files outside that set shall not be downloaded. The cache shall record
  that an edition was fetched sparsely, so a later consumer naming a wider subdir
  refetches instead of reading a missing file. Where the git in use cannot make a
  partial clone, the resolver shall fall back to the clone SR-0233 describes and
  say so once. Composition, fingerprinting and the check shall read the same bytes
  either way, so a sparse edition and a full one give one fingerprint.'
rationale: Operator's direction on 20 September 2026. The sources people compose
  are mostly graph-only repositories, where the saving is small; a product repository
  carries its source beside its graph, and the resolver has no use for it. Documents
  with region markers are the one thing outside a graph directory the Tool reads,
  and the project declares them, so they are fetched too; they are regenerated by
  CI on merge, never by the resolver.
normative: true
