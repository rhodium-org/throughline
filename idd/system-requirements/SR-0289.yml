uid: SR-0289
type: system_requirement
status: proposed
title: A condition compares values of its own register or of one holding exactly
  one item
text: A condition is one or more comparisons REGISTER.attribute OP value joined by
  and or or. For an enum the operators are == and !=, and the value one of its values;
  for an int, float or date they are ==, !=, <, <=, > and >=, and the value one of
  that base type. A declaration whose condition names an attribute of neither its
  own register nor a register declared exactly_one, uses an operator its type does
  not allow, or compares with a value its type does not allow, is refused when read.
rationale: 'No walking links: a briefing edition reaches SER.kind because the series
  register holds one item, not by following derives_from. Dates and numbers compare
  as well as enums (operator, 1 Nov 2026). Every comparison is against a fixed value,
  never another attribute, so each condition is a set of intervals and value sets
  the overlap check can decide.'
normative: true
