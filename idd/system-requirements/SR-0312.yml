uid: SR-0312
type: system_requirement
status: ratified
title: The shipped lifecycle has no approved and no draft
text: The configuration tl init writes shall declare the statuses proposed, deferred,
  ratified, implemented, verified, suspect, rejected and deleted, bind the initial
  and proposed roles both to proposed, bind the built role to implemented and verified,
  and allow proposed to move to ratified, implemented, deferred, suspect, rejected
  or deleted.
rationale: 'Approved meant agreed without a signature, and draft the status before
  proposal, which nothing enters once every item is born proposed (UR-0046). Deferred
  stays: parking is about when, not whether anyone agreed. Proposed may move straight
  to implemented since SR-0379: whether built work may land unsigned is the strict
  check''s question (SR-0380), not the status table''s, and work built ahead of agreement
  must be recordable. Who pays: nobody new; a project that wants other statuses declares
  them.'
normative: true
