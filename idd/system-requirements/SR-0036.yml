uid: SR-0036
type: system_requirement
status: rejected
title: Baselines
text: The Tool shall create named baselines pinning the exact state of all items,
  list baselines, and check out or read any baseline.
normative: true
links:
- target: UR-0013
  type: implements
attrs:
  priority: must
  verification: test
  invalidated_reason: 'Git already gives this: a tag names an exact state of every
    item, a commit hash pins one, tags are listed by git, and any of them is read
    by tl docs --at (SR-0090) and compared by tl diff (SR-0037). A second kind of
    name kept by the Tool would only repeat it. Decided by Henry Grech-Cini on 14
    November 2026.'
