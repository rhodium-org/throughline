uid: SR-0301
type: system_requirement
status: ratified
title: Without --apply, tl migrate --beneath lists what it would migrate and writes
  nothing
text: Without --apply, tl migrate --beneath writes nothing. It lists every graph
  found below the current format version, grouped by the git repository holding it,
  with the format version each declares, then counts the graphs already at the current
  version. A graph whose configuration cannot be read, or which declares a version
  newer than this tl, is listed with the reason. It exits 0. --apply without --beneath
  is a usage error.
normative: true
