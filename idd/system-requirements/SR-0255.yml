uid: SR-0255
type: system_requirement
status: ratified
title: Migration lifts the flat ratification record into the list
text: The migration to the major that introduces the list shall turn each item's
  flat ratification record into a list of one entry, carrying the ratifier, identifier,
  stamp, recorded content, recorded links, superseded identity and backfill marking
  verbatim, with no role and no time, since neither was recorded. It shall be idempotent,
  shall change no stamp and no status, shall report how many records it lifted, and
  shall leave a project that declares no roles behaving exactly as before.
rationale: Backward compatibility is the condition on the whole change. A project
  moves only when its owner runs tl migrate, as for every earlier major, and until
  then the Tool reads it as SR-0133 provides. Nothing is invented; a time the record
  never held stays absent, so a history read later tells a signature made before
  the clock from one made after. Who pays, the owner of each graph runs one command
  once; the estate's public graphs are migrated by their maintainers.
normative: true
