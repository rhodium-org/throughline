uid: SR-0091
type: system_requirement
status: ratified
title: Grounding flags must never fail silently
text: 'When ''tl new'' is invoked with a --ground flag, the Tool shall either attach
  the requested grounding link or, if it declines to add it, reject the command with
  a clear, actionable error. It shall never create the item while silently discarding
  the requested link — including for root-type sources, which may legitimately carry
  an explicit grounding link (e.g. a business_need that derives_from the vision).
  Rationale: a silently dropped grounding link yields an item the author believes
  is grounded but which surfaces only later as an orphan or unserved-root check failure
  — a fail-fast violation and a silent loss of authoring intent. Observed in throughline
  0.1.0 (2026-07-10): ''tl new BN --ground INT-0001 --ground-type derives_from''
  created the business_need with no links block because the grounding block was skipped
  for root types, and the delivery-root intent then reported unserved-root under
  ''tl check''.'
