uid: SR-0278
type: system_requirement
status: proposed
title: Every operation that reads the schema resolves the schema source
text: In a project with a schema source, every operation that reads the project's
  schema shall resolve that source and its own schema sources, and no other source
  unless its answer depends on the union. In cache-only mode a cold cache for a schema
  source is a refusal.
rationale: 'SR-0230 lists operations that resolve nothing, among them amend, status
  and schema. With a schema source their answers depend on that source, so NG-0008''s
  rule against resolving for an answer that does not depend on it still holds, but
  the list no longer does for such a project. Rejected: writing the resolved schema
  into the project as a lock file, which is the copy again under another name. Who
  pays: a keeper working offline needs the source cached once.'
normative: true
