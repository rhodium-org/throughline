uid: SR-0320
type: system_requirement
status: proposed
title: A link declaration may run outside the follower
text: A link declaration whose outside attribute is true names no register it runs
  to and no per_target_min, and the Tool refuses one that names either when it reads
  it. tl check shall count, against its min and max and for the rule undeclared,
  each link of its type from an item of its from register to an item the follower
  borrows from a source it composes other than its schema source and the sources
  composed through that, whatever the target's register; a link of that type to the
  follower's own item or to an item of its schema source is counted by no such declaration.
  The dump marks each such link with the declaration.
rationale: 'A glossary''s term is defined from items of the graph it explains, which
  the glossary composes, and a standard for glossaries cannot know that graph''s
  registers: every link declaration had to name them, so tl check refused every such
  link as undeclared (throughline-glossary-standard, 10 November 2026). Leaving the
  link undeclared would lose the rule that every term is defined from something;
  declaring the explained graph''s registers in each glossary would declare registers
  it does not hold.'
normative: true
