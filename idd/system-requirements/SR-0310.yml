uid: SR-0310
type: system_requirement
status: ratified
title: The starter graph is seeded proposed
text: The example items tl init writes shall be born proposed, as every item is.
  tl check passes over them with a warning for each; check --strict fails until a
  person signs or deletes each placeholder.
rationale: 'Seeded approved, the placeholders claimed an agreement nobody gave. Signing
  them for the user would put a name on words that say ''replace this''. Rejected:
  seeding no example, which leaves the newcomer an empty project to reverse-engineer
  (SR-0100). Who pays: a new user, whose strict gate is red until they sign or delete
  five placeholders, which is the first thing the tool teaches them.'
normative: true
