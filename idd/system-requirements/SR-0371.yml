uid: SR-0371
type: system_requirement
status: ratified
title: tl doctor says what Python runs tl and how tl was installed
text: tl doctor shall print the tl version, the Python version and executable running
  it, the interpreter its environment was made from and whether uv manages that interpreter,
  and which installer made the environment (uv tool, pipx, another virtual environment,
  or none it can tell), with that installer's command to rebuild the environment
  on a new Python, and shall exit 0.
rationale: 'After a Python upgrade the first question is what runs tl and how it
  was installed, because the answer decides which rebuild command applies; asked
  before an upgrade, it says whether the install depends on the operating system''s
  Python. It cannot help once the interpreter is gone, which is why the README carries
  the recovery too. Rejected, adding this to --version: scripts read its one line
  (SR-0076). Who pays: nobody; it is a new read-only command.'
normative: true
