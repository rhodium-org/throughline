uid: SR-0125
type: system_requirement
status: rejected
title: Pre-integration references resolve by GUID
text: Before a UID is allocated, references between newly created items shall be
  expressed and resolved by GUID; reference resolution shall accept either a UID
  (published items) or a GUID (pre-integration items).
normative: true
links:
- target: UR-0026
  type: implements
attrs:
  priority: must
  verification: test
  origin: hybrid
  invalidated_reason: 'Superseded by tl resolve (SR-0006, SR-0248, SR-0250): a UID
    allocated on two branches is detected when they merge and the later item is renumbered,
    with the links to it rewritten. GUID identity was never built, and SR-0123 contradicts
    SR-0154, which is what the fingerprint does. A signature given before a merge
    is kept safe by ratifying on the main branch. Decided by Henry Grech-Cini on
    14 November 2026.'
