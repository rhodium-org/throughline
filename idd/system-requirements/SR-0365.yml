uid: SR-0365
type: system_requirement
status: ratified
title: A change set stamps a stale link again
text: A link operation that asks for a stamp, on a link the item already holds, shall
  count as already applied only while that link's stamp is the fingerprint of its
  target. Otherwise tl apply shall stamp the link again and report it restamped.
rationale: Found 16 November 2026 by two independent builds of the Tool from its
  specification and about 100,000 runs comparing them with tl 5.11.1, reproduced
  on 6.0.0. A link on an existing link was already applied whatever its stamp, so
  an assistant working from an export could not confirm a link whose target had changed,
  which tl link --stamp does. Applying the set a second time still changes nothing.
normative: true
