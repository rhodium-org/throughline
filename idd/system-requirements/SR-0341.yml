uid: SR-0341
type: system_requirement
status: implemented
title: The documents gate fails where a configured document is not there
text: tl docs --check shall fail, naming the pattern, where a pattern under [docs]
  paths matches no file. tl docs shall refuse the same way and write nothing.
rationale: 'A configured document that is deleted or renamed stops matching its pattern,
  so the gate has nothing to compare and reports the documents up to date (issue
  57). A document emptied of its markers cannot be told from one that never had any,
  and stays a no-op (SR-0094). Who pays: a project whose configuration names a pattern
  it does not use removes the pattern.'
normative: true
