uid: SR-0333
type: system_requirement
status: ratified
title: A finding's message names values without Python's renderings
text: A finding's message and a chart's label shall write a list as its members joined
  by a comma and a space, a text value in double quotes, any other value as YAML
  writes it, and a kind as string, integer, float, boolean, list, mapping or null.
  A finding's rule, severity and item are unchanged.
rationale: 'Messages embed Python''s text for a list, a value and a type ([''a'',
  ''b''], ''x'', NoneType), which a reader who is not a Python programmer must decode
  and another implementation cannot reproduce without copying Python. Who pays: anything
  that matches on the exact wording of these messages; the rule id is the stable
  contract (SR-0044).'
normative: true
