uid: SR-0290
type: system_requirement
status: proposed
title: Two declarations of one attribute must have exclusive conditions
text: Where two attribute declarations name the same attribute of one register, the
  Tool shall decide, from the intervals and value sets their conditions allow, whether
  any item can satisfy both, and if one can refuse the standard when read, naming
  both declarations and a shared case, and printing exclusive conditions that would
  fix it and the tl amend command that applies them.
rationale: 'A claim''s role is news or background in a briefing and guidance or product
  in training: two declarations, each with its own value set. Failing fast with the
  rewrite keeps the fix one command away.'
normative: true
links:
- target: UR-0044
  type: implements
attrs:
  priority: must
  verification: test
  origin: ai
