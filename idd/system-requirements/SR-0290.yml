uid: SR-0290
type: system_requirement
status: ratified
title: An attribute is declared once per register
text: 'An attribute of a register shall be declared at most once across a follower,
  its standard and the standard''s own schema sources. A second declaration of the
  same attribute of the same register is refused when read, whatever its conditions,
  naming both declarations and the ways to avoid the clash: rename one, or alias
  the imported one.'
rationale: 'No coalescence: one name means one declaration, so an app never has to
  work out which of two declarations an attribute answers to. Two meanings get two
  names. (Operator, 1 Nov 2026; replaces two declarations of one attribute under
  exclusive conditions.)'
normative: true
