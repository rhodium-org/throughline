uid: UR-0043
type: user_requirement
status: ratified
title: A graph that follows a standard is started with one command
text: As someone starting a graph that follows a standard published as another graph,
  I want one init command naming the standard to give me a graph that already follows
  it, with the registers the standard expects, so that I need not hand-edit the configuration
  or work out the register set the standard already settled.
rationale: 'Found 1 November 2026 starting a plan against throughline-plan-standard:
  init --bare, then a hand-written [[sources]] block with schema = true, then one
  register new per kind, each prefix and folder copied from the conformance example.
  The standard had already decided all of it. Rejected: the shape skill, which discovers
  a register set by conversation and is the right tool only where no standard has
  settled one. Rejected: a template copied at init, which UR-0041 already rejects
  for the schema; writing the source line is not a copy. Who pays: the maintainer
  carries the init option; a standard''s keeper may declare its registers, and need
  not.'
normative: true
