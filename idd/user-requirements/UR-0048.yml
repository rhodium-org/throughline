uid: UR-0048
type: user_requirement
status: proposed
title: A release is shown to leave existing graphs as they were, or to say what it
  changes
text: As someone who keeps graphs with the Tool, I want every release measured, before
  it is published, against the graphs that already exist, so that upgrading never
  changes what a graph of mine answers without the release having said so first.
rationale: 'Asked for by Henry Grech-Cini on 14 November 2026: changes are to be
  made in a controlled, thoroughly tested way that breaks no existing graph. 5.4.0
  was compared with 5.2.0 over 480 graphs by hand, once; nothing makes the next release
  do the same. Who pays: whoever cuts a release runs the comparison and reads its
  report.'
normative: true
