uid: UR-0040
type: user_requirement
status: ratified
title: A ratification record says when it was given
text: Every ratification and every withdrawal the Tool writes shall record when it
  was made, so that the order and timing of signatures can be read from the record
  itself and not only from version control.
rationale: The commit is the only clock today, and one commit usually carries a whole
  wave of signatures, so the time at which each item was signed is lost. A history
  of a graph, and any comparison of how two people reviewed the same set, needs the
  time per item. Rejected, committing after every signature, which asks every front
  end to change how it commits and still loses the time when a person works offline
  and commits once. Who pays, nobody; the record grows by one field.
normative: true
