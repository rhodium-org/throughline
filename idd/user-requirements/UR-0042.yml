uid: UR-0042
type: user_requirement
status: proposed
title: A change set applied twice changes the graph once
text: As someone applying a change set an assistant drafted, I want to apply it again,
  by mistake or because I cannot tell whether it ran, and have the graph changed
  only once, so that I never have to find and delete duplicate items by hand.
rationale: 'A change set is all or nothing (SR-0252), so a half-applied set cannot
  happen, but a whole set applied twice can: each new operation creates a second
  item under the next UID, and the duplicates pass check because each is well formed
  and grounded. On 25 October 2026 a day-old one-shot script re-ran inside a later
  tool result on this workstation; a change set left beside a graph will be replayed
  the same way. Rejected: matching an existing item by its title, which breaks the
  first time an item is retitled, and the brief tells authors to rewrite. Rejected:
  an exist-ok flag on tl link alone, which leaves new, the operation that duplicates,
  unguarded. Who pays: an assistant writing a change set adds one key to each new
  operation.'
