uid: UR-0052
type: user_requirement
status: ratified
title: Signing says whether it agrees a plan or accepts what exists
text: Where a person is asked to sign an item, the Tool shall say whether the signature
  agrees something not yet built or accepts something already built, and for the
  latter show when it was built and from which revision.
rationale: 'Signing a plan and accepting existing work are different judgements;
  the operator found the line between them blurred on 22 November 2026, when signatures
  given at review read as plans agreed. UR-0029 shows the signer the wording; this
  shows them what the wording describes the state of. Who pays: front ends that ask
  for signatures (tl ratify, tl-ratify), which show one more line.'
normative: true
