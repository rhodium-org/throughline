uid: UR-0026
type: user_requirement
status: ratified
title: Conflict-free parallel identity allocation
text: 'Users working independently on divergent branches shall be able to create
  requirements in parallel and merge them without silently losing an item and without
  resolving a numbering clash by hand: where two branches allocate the same UID,
  the Tool detects it when they merge and renumbers the later item.'
normative: true
