title: Search and filter
text: Users shall be able to find requirements by any combination of attribute values,
  text search, and link conditions.
rationale: 'Tags were named here from the filter strings other requirements tools
  offer, and the Tool never built them; a project classifies its items with attributes
  instead (issue #40).'
