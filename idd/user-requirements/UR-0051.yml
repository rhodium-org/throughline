uid: UR-0051
type: user_requirement
status: ratified
title: Nothing lands built but unagreed, except what was built before the graph
text: The gate a project lands work through shall refuse an item that is built and
  not agreed, unless it was built before the graph was laid over existing work; work
  in progress may hold such items until it lands.
rationale: 'UR-0046 already makes the strict check refuse an implemented item with
  no signature. This keeps that rule, lets it apply to the item and not to its status
  name, and exempts existing work a graph was laid over, which no one could have
  agreed before it was built. Building ahead on a branch is allowed because the gate
  is landing: an agent builds and a person signs at review (the Python-upgrade pull
  requests of 22 November 2026). Who pays: nobody new; an adopted graph''s existing
  work stops failing the gate it could never pass.'
normative: true
