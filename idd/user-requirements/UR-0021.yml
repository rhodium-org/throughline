uid: UR-0021
type: user_requirement
status: ratified
title: Verifiable development environment
text: A contributor shall be able to run a single command that diagnoses their development
  environment — Python version, an importable/installed throughline, the test runner,
  whether the local grounding gate is wired, and whether each package of the toolchain
  they have checked out is the one actually being run rather than a published release
  standing in for it — and reports, per check, either pass or a specific remediation,
  exiting non-zero if the environment is not ready.
rationale: The checks are the ones whose failure is silent. A missing interpreter
  or test runner announces itself the moment work starts, but an environment that
  runs a published package while the contributor edits its source announces nothing
  at all — the code imports, the tests pass, and the version string names the release
  it is not. A full day was lost to that here, comparing a cockpit against a validator
  that were different builds of the same toolchain. Checking out a sibling package
  is the signal that it is being worked on, so the diagnosis is drawn from what the
  contributor has on disk rather than from anything they must remember to declare.
normative: true
