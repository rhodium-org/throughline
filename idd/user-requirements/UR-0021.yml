uid: UR-0021
type: user_requirement
status: ratified
title: Verifiable development environment
text: A contributor shall be able to run a single command that diagnoses their development
  environment — Python version, an importable/installed throughline, the test runner,
  whether the local grounding gate is wired, and, for each toolchain package they
  have checked out, which build each installed command actually runs. A package may
  be installed twice under different command names, one running the working tree
  and one a published release. The report shall name which command runs which, and
  shall fail only when no command runs the working tree. Each check reports either
  pass or a specific remediation, and the command exits non-zero if the environment
  is not ready.
rationale: The checks are the ones whose failure is silent. An environment that runs
  a published package while the contributor edits its source announces nothing at
  all — the code imports, the tests pass, and the version string names the release
  it is not. A full day was lost to that here, comparing a cockpit against a validator
  that were different builds of the same toolchain. Two installs under different
  command names is a deliberate arrangement rather than that failure; it lets one
  machine gate the estate with a release and develop the tree at the same time. Requiring
  a fixed command name to be the working tree would ban that arrangement, so the
  diagnosis names which build each command runs instead. This widens what a contributor
  may have installed and so lifts an obligation rather than adding one. A version
  label is not evidence — an editable install writes its label once, at install time,
  and never refreshes it — so the diagnosis is drawn from what is on disk.
normative: true
