uid: UR-0050
type: user_requirement
status: ratified
title: A graph laid over existing work says when it was laid
text: A project shall be able to record when its graph was laid over work that already
  existed, so that items built before then are read as existing work waiting to be
  accepted, not as work done without agreement.
rationale: 'Laying a graph over an existing project makes every item unsigned and
  built, which is honest; building from scratch should build nothing unsigned. One
  date tells the two apart without a mode per graph, and a graph started from scratch
  simply has none. Rejected, a mode switch per graph (adopted or greenfield): a graph
  adopted once is greenfield for everything added after, and a mode cannot say which
  items are which. Who pays: a project laying a graph over existing work sets one
  date.'
normative: true
